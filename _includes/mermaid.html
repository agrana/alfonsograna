<!-- Mermaid.js for diagram rendering -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async function() {
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        primaryColor: '#00ff00',
        primaryTextColor: '#ffffff',
        primaryBorderColor: '#00ff00',
        lineColor: '#00ff00',
        secondaryColor: '#006100',
        tertiaryColor: '#ffffff',
        background: '#1a1a1a',
        mainBkg: '#1a1a1a',
        secondBkg: '#2a2a2a',
        tertiaryBkg: '#3a3a3a'
      },
      flowchart: {
        htmlLabels: true,
        curve: 'basis'
      }
    });

    document.querySelectorAll('code.language-mermaid').forEach(function(block) {
      const diagram = document.createElement('div');
      diagram.className = 'mermaid';
      diagram.textContent = block.textContent;
      block.parentElement.replaceWith(diagram);
    });

    await mermaid.run();

    const diagrams = document.querySelectorAll('.mermaid');
    if (!diagrams.length || typeof HTMLDialogElement === 'undefined') {
      return;
    }

    const dialog = document.createElement('dialog');
    dialog.className = 'mermaid-dialog';
    dialog.setAttribute('aria-label', 'Expanded diagram');
    dialog.innerHTML = [
      '<button class="mermaid-dialog-close" type="button" aria-label="Close expanded diagram">Close</button>',
      '<div class="mermaid-dialog-content"></div>'
    ].join('');
    document.body.appendChild(dialog);

    const closeButton = dialog.querySelector('.mermaid-dialog-close');
    const content = dialog.querySelector('.mermaid-dialog-content');
    let activeDiagram = null;
    let placeholder = null;

    function openDiagram(diagram) {
      if (dialog.open) {
        return;
      }

      placeholder = document.createComment('Mermaid diagram placeholder');
      diagram.before(placeholder);
      content.appendChild(diagram);
      diagram.classList.add('mermaid-expanded');
      activeDiagram = diagram;
      dialog.showModal();
      closeButton.focus();
    }

    function restoreDiagram() {
      if (!activeDiagram || !placeholder) {
        return;
      }

      activeDiagram.classList.remove('mermaid-expanded');
      placeholder.replaceWith(activeDiagram);
      activeDiagram.focus();
      activeDiagram = null;
      placeholder = null;
    }

    diagrams.forEach(function(diagram) {
      diagram.dataset.zoomable = 'true';
      diagram.setAttribute('role', 'button');
      diagram.setAttribute('tabindex', '0');
      diagram.setAttribute('aria-label', 'Open diagram in fullscreen');
      diagram.setAttribute('title', 'Click to expand diagram');

      diagram.addEventListener('click', function() {
        openDiagram(diagram);
      });

      diagram.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openDiagram(diagram);
        }
      });
    });

    closeButton.addEventListener('click', function() {
      dialog.close();
    });

    dialog.addEventListener('click', function(event) {
      if (event.target === dialog) {
        dialog.close();
      }
    });

    dialog.addEventListener('close', restoreDiagram);
  });
</script>

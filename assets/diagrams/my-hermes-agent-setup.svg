<text x="80" y="66" class="title">My Hermes Agent Setup</text>
<text x="80" y="98" class="subtitle">One self-hosted Linux box runs Hermes — chat, tools, memory, inference, coding, and shipping.</text>
<text x="80" y="126" class="machine">Host: any always-on Linux machine · hardware and distribution are interchangeable</text>


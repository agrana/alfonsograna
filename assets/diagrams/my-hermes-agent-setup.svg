<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1280" viewBox="0 0 1700 1280" role="img" aria-labelledby="title desc">
<title id="title">My Hermes Agent Setup</title>
<desc id="desc">Architecture diagram of My Hermes Agent Setup on a self-hosted Linux box: Discord and SSH/RDP access, Hermes gateway and core, memory layers, and separated external inference, coding, and shipping systems.</desc>
<defs>
  <marker id="arrow-blue" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L12,4.5 L0,9 Z" fill="#2563eb"/></marker>

  <text x="600" y="958" class="section">How it fits together</text>
  <text x="600" y="998" class="subtitle">Discord hits Gateway first; SSH and RDP talk to Hermes directly. Hermes is chat and agent together.</text>
  <text x="600" y="1030" class="subtitle">Honcho holds agent memory. Obsidian holds your notes. OpenAI and OpenRouter sit in the inference layer.</text>
  <text x="600" y="1062" class="subtitle">Coding tools and the shipping stack are grouped separately from inference.</text>
</g>
